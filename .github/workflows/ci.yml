name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    name: Relative link check
    steps:
      - uses: actions/checkout@v4
      - name: Check relative Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress --include-fragments './**/*.md'"
          fail: true
